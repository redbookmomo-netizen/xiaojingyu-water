  <title>花瓣与水面 · 小鲸鱼给老婆的水波光影</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }
    .outer-wrap {
      position: relative;
      width: 100%;
      height: 486px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      border-radius: 20px;
      overflow: hidden;
      background: linear-gradient(145deg, rgba(186, 212, 238, 0.35), rgba(225, 205, 228, 0.28));
    }
    body.tall-viewport .outer-wrap {
      height: 100vh;
      height: 100dvh;
      border-radius: 0;
      padding: 16px;
    }
    .ambient-bg {
      position: absolute;
      inset: -32px;
      background-size: cover;
      background-position: center;
      filter: blur(26px) saturate(1.2) brightness(1.03);
      transform: scale(1.08);
      opacity: 0.78;
      pointer-events: none;
      z-index: 0;
    }
    .stage-container {
      position: relative;
      z-index: 1;
      height: 100%;
      aspect-ratio: 576 / 1024;
      max-width: 100%;
      border-radius: 22px;
      overflow: hidden;
      box-shadow:
        0 18px 50px rgba(32, 62, 108, 0.32),
        0 0 0 1.5px rgba(255, 255, 255, 0.72) inset;
      touch-action: none;
      background: #cfe0f0;
    }
    canvas#waterCanvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
    .top-bar {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 4;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      pointer-events: none;
    }
    .bottom-bar {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      z-index: 4;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      pointer-events: none;
    }
    .glass-btn {
      pointer-events: auto;
      height: 28px;
      padding: 0 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.42);
      color: rgba(28, 52, 88, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.85);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.04em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 4px 14px rgba(45, 78, 128, 0.15);
      transition: all 0.22s ease;
      white-space: nowrap;
    }
    .glass-btn:hover {
      background: rgba(255, 255, 255, 0.65);
      transform: translateY(-1px);
    }
    .glass-btn:active {
      transform: translateY(0) scale(0.96);
    }
    .glass-btn[data-off="true"] {
      opacity: 0.56;
      background: rgba(240, 245, 252, 0.25);
    }
    .guide-toast {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 48px;
      z-index: 3;
      text-align: center;
      padding: 8px 12px;
      border-radius: 14px;
      background: rgba(25, 48, 82, 0.34);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.45);
      color: rgba(255, 255, 255, 0.96);
      font-size: 12px;
      line-height: 1.65;
      letter-spacing: 0.08em;
      text-shadow: 0 1px 6px rgba(20, 40, 80, 0.45);
      pointer-events: none;
      transition: opacity 0.9s ease, transform 0.9s ease;
    }
    .guide-toast.hide-toast {
      opacity: 0;
      transform: translateY(6px);
    }
    @media (max-width: 640px) {
      body, body.tall-viewport {
        background: #bcd4ea;
      }
      .outer-wrap, body.tall-viewport .outer-wrap {
        padding: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        height: 100dvh !important;
        border-radius: 0 !important;
      }
      .stage-container {
        width: 100vw !important;
        height: 100vh !important;
        height: 100dvh !important;
        aspect-ratio: auto !important;
        border-radius: 0 !important;
        box-shadow: none !important;
      }
      .top-bar {
        top: max(14px, calc(env(safe-area-inset-top, 14px) + 6px)) !important;
        left: 14px !important;
        right: 14px !important;
      }
      .bottom-bar {
        bottom: max(18px, calc(env(safe-area-inset-bottom, 18px) + 6px)) !important;
        left: 14px !important;
        right: 14px !important;
      }
      .guide-toast {
        bottom: max(62px, calc(env(safe-area-inset-bottom, 18px) + 52px)) !important;
      }
      .glass-btn {
        height: 34px !important;
        padding: 0 13px !important;
        font-size: 13px !important;
      }
    }
  </style>

  /* ============================================================================
   * 1. Web Audio 实时合成引擎：
   *    - 定情曲 Erik Satie《Gymnopédie No. 1》真实乐谱进行 + 柔和毛毡钢琴音色
   *    - 指尖触水：清脆水滴声（正弦扫频泛音）+ D大调五声水光泛音
   *    - 手指滑动：细腻连续的流水波光声
   * ============================================================================ */
  const SoundEngine = (function() {
    let ctx = null;
    let masterGain, reverbNode, wetGain, bgmGain, sfxGain;
    let isUnlocked = false;
    let bgmMode = 0; // 0: Satie Gymnopédie No.1, 1: 静音
    let sfxEnabled = true;
    let bgmTimer = null;
    let stepIndex = 0;

    const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
    // D major / B minor pentatonic notes for interactive water touches
    const WATER_NOTES = [62, 66, 69, 71, 73, 74, 78, 81, 83, 85, 86, 90];

    // Erik Satie - Gymnopédie No. 1 authentic bars (3/4 time, Lent et douloureux)
    // Alternating Gmaj7 (bass G2=43, chord B3=59, D4=62, F#4=66)
    // and Dmaj7 (bass D2=38, chord A3=57, C#4=61, F#4=66)
    const SATIE_BARS = [
      { bass: 43, chord: [59, 62, 66], mel: [null, null, null] },
      { bass: 38, chord: [57, 61, 66], mel: [null, null, null] },
      { bass: 43, chord: [59, 62, 66], mel: [null, null, null] },
      { bass: 38, chord: [57, 61, 66], mel: [null, null, null] },
      { bass: 43, chord: [59, 62, 66], mel: [null, 78, 81] },   // F#5, A5
      { bass: 38, chord: [57, 61, 66], mel: [79, 78, 73] },     // G5, F#5, C#5
      { bass: 43, chord: [59, 62, 66], mel: [71, 73, 74] },     // B4, C#5, D5
      { bass: 38, chord: [57, 61, 66], mel: [69, null, null] }, // A4
      { bass: 43, chord: [59, 62, 66], mel: [66, null, null] }, // F#4 held
      { bass: 38, chord: [57, 61, 66], mel: [null, null, null] },
      { bass: 43, chord: [59, 62, 66], mel: [null, 78, 81] },   // F#5, A5
      { bass: 38, chord: [57, 61, 66], mel: [79, 78, 73] },     // G5, F#5, C#5
      { bass: 43, chord: [59, 62, 66], mel: [71, 73, 74] },     // B4, C#5, D5
      { bass: 38, chord: [57, 61, 66], mel: [69, null, null] }, // A4
      { bass: 43, chord: [59, 62, 66], mel: [73, null, null] }, // C#5
      { bass: 38, chord: [57, 61, 66], mel: [78, null, null] }, // F#5
      { bass: 40, chord: [59, 62, 67], mel: [64, null, null] }  // E4 over Em7
    ];

    function buildImpulseResponse(c, duration, decay) {
      const rate = c.sampleRate;
      const length = Math.floor(rate * duration);
      const impulse = c.createBuffer(2, length, rate);
      for (let ch = 0; ch < 2; ch++) {
        const data = impulse.getChannelData(ch);
        for (let i = 0; i < length; i++) {
          const t = i / length;
          data[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay) * Math.min(1, i / (rate * 0.015));
        }
      }
      return impulse;
    }

    function initContext() {
      if (ctx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ctx = new AC();

      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -18;
      comp.knee.value = 14;
      comp.ratio.value = 3.5;

      masterGain = ctx.createGain();
      masterGain.gain.value = 0.95;

      reverbNode = ctx.createConvolver();
      reverbNode.buffer = buildImpulseResponse(ctx, 3.4, 2.3);

      wetGain = ctx.createGain();
      wetGain.gain.value = 0.48;

      bgmGain = ctx.createGain();
      bgmGain.gain.value = 0.45;

      sfxGain = ctx.createGain();
      sfxGain.gain.value = 0.65;

      bgmGain.connect(masterGain);
      bgmGain.connect(reverbNode);
      sfxGain.connect(masterGain);
      sfxGain.connect(reverbNode);
      reverbNode.connect(wetGain);
      wetGain.connect(masterGain);
      masterGain.connect(comp);
      comp.connect(ctx.destination);
    }

    function playFeltPiano(time, midi, velocity, duration, targetBus) {
      if (!ctx) return;
      const freq = mtof(midi);
      const noteGain = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.Q.value = 0.3;
      filter.frequency.setValueAtTime(Math.min(6500, freq * 4.5 + 500), time);
      filter.frequency.exponentialRampToValueAtTime(Math.max(240, freq * 1.4), time + duration);

      noteGain.gain.setValueAtTime(0.0001, time);
      noteGain.gain.linearRampToValueAtTime(velocity, time + 0.018);
      noteGain.gain.exponentialRampToValueAtTime(velocity * 0.32, time + duration * 0.45);
      noteGain.gain.exponentialRampToValueAtTime(0.0001, time + duration);

      const harmonics = [
        { mult: 1, amp: 1.0, type: 'triangle' },
        { mult: 2, amp: 0.22, type: 'sine' },
        { mult: 3, amp: 0.06, type: 'sine' }
      ];

      harmonics.forEach(h => {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = h.type;
        osc.frequency.setValueAtTime(freq * h.mult, time);
        g.gain.value = h.amp;
        osc.connect(g);
        g.connect(filter);
        osc.start(time);
        osc.stop(time + duration + 0.05);
      });

      filter.connect(noteGain);
      noteGain.connect(targetBus);
    }

    // Authentic water droplet chirp (upward pitch-bend bubble + crystal harmonic)
    function playWaterDrop(time, baseFreq, amp) {
      if (!ctx || !sfxEnabled) return;
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(baseFreq * 0.58, time);
      osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.42, time + 0.085);

      g.gain.setValueAtTime(0.0001, time);
      g.gain.linearRampToValueAtTime(amp, time + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, time + 0.14);

      osc.connect(g);
      g.connect(sfxGain);
      osc.start(time);
      osc.stop(time + 0.16);
    }

    function scheduleSatieBar() {
      if (!ctx || bgmMode === 1) return;
      const now = ctx.currentTime + 0.05;
      const beat = 0.86; // Gently slow 3/4 Gymnopédie tempo
      const bar = SATIE_BARS[stepIndex % SATIE_BARS.length];
      stepIndex++;

      // Beat 1: Deep warm bass
      playFeltPiano(now, bar.bass, 0.14, beat * 2.8, bgmGain);

      // Beat 2: Floating maj7 chord
      bar.chord.forEach((m, idx) => {
        playFeltPiano(now + beat + idx * 0.025, m, 0.075, beat * 1.9, bgmGain);
      });

      // Melody notes on beats 1, 2, 3
      bar.mel.forEach((m, beatIdx) => {
        if (m !== null) {
          playFeltPiano(now + beatIdx * beat + 0.02, m, 0.125, beat * 2.4, bgmGain);
        }
      });
    }

    function startBgmLoop() {
      if (bgmTimer) return;
      scheduleSatieBar();
      bgmTimer = setInterval(() => {
        if (ctx && ctx.state === 'running' && bgmMode === 0) {
          scheduleSatieBar();
        }
      }, 2580);
    }

    let lastDragSound = 0;

    return {
      unlock() {
        initContext();
        if (!ctx) return;
        if (ctx.state === 'suspended') {
          ctx.resume();
        }
        try {
          const buf = ctx.createBuffer(1, 1, 22050);
          const src = ctx.createBufferSource();
          src.buffer = buf;
          src.connect(ctx.destination);
          src.start(0);
        } catch (e) {}
        if (!isUnlocked) {
          isUnlocked = true;
          startBgmLoop();
        }
      },
      tap(nx, ny) {
        if (!ctx || !sfxEnabled) return;
        const now = ctx.currentTime;
        const idx = Math.min(WATER_NOTES.length - 1, Math.max(0, Math.floor((1 - ny) * WATER_NOTES.length)));
        const midi = WATER_NOTES[idx];
        playWaterDrop(now, 520 + (1 - ny) * 580 + (nx - 0.5) * 140, 0.14);
        playFeltPiano(now + 0.015, midi, 0.11, 1.9, sfxGain);
      },
      drag(nx, ny) {
        if (!ctx || !sfxEnabled) return;
        const nowMs = performance.now();
        if (nowMs - lastDragSound < 72) return;
        lastDragSound = nowMs;
        const now = ctx.currentTime;
        const idx = Math.min(WATER_NOTES.length - 1, Math.max(0, Math.floor((1 - ny) * WATER_NOTES.length)));
        const midi = WATER_NOTES[idx];
        playWaterDrop(now, 680 + (1 - ny) * 620 + (Math.random() - 0.5) * 160, 0.055);
        if (Math.random() < 0.48) {
          playFeltPiano(now + 0.01, midi, 0.045, 1.2, sfxGain);
        }
      },
      whaleSplash() {
        if (!ctx || !sfxEnabled) return;
        const now = ctx.currentTime;
        [62, 66, 69, 74, 78, 81].forEach((m, i) => {
          playWaterDrop(now + i * 0.065, 480 + i * 130, 0.09);
          playFeltPiano(now + i * 0.07, m, 0.085, 2.2, sfxGain);
        });
      },
      toggleBgm() {
        this.unlock();
        bgmMode = bgmMode === 0 ? 1 : 0;
        if (bgmGain && ctx) {
          bgmGain.gain.setTargetAtTime(bgmMode === 0 ? 0.45 : 0.0001, ctx.currentTime, 0.25);
        }
        return bgmMode === 0;
      },
      toggleSfx() {
        this.unlock();
        sfxEnabled = !sfxEnabled;
        return sfxEnabled;
      }
    };
  })();

  /* ============================================================================
   * 2. WebGL 实时水面物理波纹 + 焦散光斑 + 棱镜色散 + 十字星芒反光渲染器
   * ============================================================================ */
  const canvas = document.getElementById('waterCanvas');
  const gl = canvas.getContext('webgl', { alpha: false, antialias: true, premultipliedAlpha: false });

  if (!gl) {
    canvas.style.background = `url("${IMG_DATA_URI}") center/cover no-repeat`;
    return;
  }

  const VERT_SRC = `
    attribute vec2 aPos;
    varying vec2 vUv;
    void main() {
      vUv = aPos * 0.5 + 0.5;
      vUv.y = 1.0 - vUv.y;
      gl_Position = vec4(aPos, 0.0, 1.0);
    }
  `;

  // Fragment Shader:
  // Combines 2D physical wave heightfield + ambient breeze ripples + chromatic dispersion refraction
  // + underwater caustic light focusing + 4/8-point diamond starburst specular highlights
  const FRAG_SRC = `
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D uTex;
    uniform sampler2D uWave;
    uniform vec2 uRes;
    uniform vec2 uTexSize;
    uniform float uTime;
    uniform float uSparkle;

    // Cover-fit UV calculation
    vec2 coverUv(vec2 uv, vec2 res, vec2 tex) {
      float rs = res.x / res.y;
      float rt = tex.x / tex.y;
      vec2 s = rs > rt ? vec2(1.0, rt / rs) : vec2(rs / rt, 1.0);
      return (uv - 0.5) * s + 0.5;
    }

    // 4-point & 8-point diamond starlight cross function
    float starGlint(vec2 p, float angle) {
      float c = cos(angle), s = sin(angle);
      vec2 r = mat2(c, -s, s, c) * p;
      float arm1 = exp(-abs(r.x) * 38.0) * exp(-abs(r.y) * 5.5);
      float arm2 = exp(-abs(r.y) * 38.0) * exp(-abs(r.x) * 5.5);
      float core = exp(-dot(r, r) * 180.0);
      return clamp(arm1 + arm2 + core * 1.4, 0.0, 1.0);
    }

    void main() {
      vec2 aspect = vec2(uRes.x / uRes.y, 1.0);
      vec2 uv = coverUv(vUv, uRes, uTexSize);

      // Sample physical wave texture:
      // R = dH/dx, G = dH/dy, B = Height H, A = Laplacian curvature (caustic focus)
      vec4 wData = texture2D(uWave, vUv);
      vec2 physGrad = (wData.rg - (128.0 / 255.0)) * 2.4;
      float physHeight = (wData.b - (128.0 / 255.0)) * 2.0;
      float physCurve = (wData.a - (128.0 / 255.0)) * 2.2;

      // Subtle ambient water shimmer so the surface breathes gently at all times
      vec2 p = vUv * aspect * 10.0;
      float ambX = cos(p.x * 1.9 + uTime * 1.45 + sin(p.y * 1.5 - uTime * 0.9)) * 0.012
                 + cos(p.x * 4.3 - p.y * 3.1 + uTime * 2.3) * 0.006;
      float ambY = sin(p.y * 2.1 - uTime * 1.35 + cos(p.x * 1.7 + uTime * 1.1)) * 0.012
                 + sin(p.y * 4.1 + p.x * 2.8 - uTime * 2.1) * 0.006;

      vec2 grad = physGrad + vec2(ambX, ambY) * (0.45 + 0.55 * uSparkle);
      float gradMag = length(grad);

      // Chromatic aberration (prism rainbow dispersion on water waves)
      vec2 refractOffset = grad * vec2(0.058, 0.058 * (uRes.x / uRes.y));
      float dispersion = clamp(gradMag * 0.26, 0.0, 0.012);
      vec2 uvR = clamp(uv + refractOffset * (1.0 - dispersion * 18.0), 0.002, 0.998);
      vec2 uvG = clamp(uv + refractOffset, 0.002, 0.998);
      vec2 uvB = clamp(uv + refractOffset * (1.0 + dispersion * 18.0), 0.002, 0.998);

      vec3 col;
      col.r = texture2D(uTex, uvR).r;
      col.g = texture2D(uTex, uvG).g;
      col.b = texture2D(uTex, uvB).b;

      // 3D Surface Normal & Fresnel + Blinn-Phong Sunlight Specular
      vec3 N = normalize(vec3(-grad.x * 2.8, -grad.y * 2.8, 1.0));
      vec3 L1 = normalize(vec3(-0.38, -0.52, 0.76)); // Main sun angle
      vec3 L2 = normalize(vec3(0.45, -0.30, 0.84));  // Secondary sky fill light
      vec3 V  = vec3(0.0, 0.0, 1.0);
      vec3 H1 = normalize(L1 + V);
      vec3 H2 = normalize(L2 + V);

      float spec1 = pow(max(0.0, dot(N, H1)), 52.0);
      float spec2 = pow(max(0.0, dot(N, H2)), 85.0);
      float rimCrest = pow(clamp(gradMag * 1.65, 0.0, 1.0), 1.8);

      // Caustic light focusing along wave crests and troughs
      float caustic = clamp(physCurve * 0.55 + (spec1 - 0.08) * 0.4, -0.18, 0.45);
      col *= (1.0 + caustic * 0.38);

      // Sparkling Diamond Starlight Glints ("波光粼粼的反光")
      float luma = dot(col, vec3(0.299, 0.587, 0.114));
      // Animated sparkle cells across the water surface
      vec2 cellCoord = vUv * aspect * 18.0 + grad * 3.2;
      vec2 cellId = floor(cellCoord);
      vec2 cellUv = fract(cellCoord) - 0.5;
      float rnd = fract(sin(dot(cellId, vec2(127.1, 311.7))) * 43758.5453);
      float twinklePhase = sin(uTime * (2.2 + rnd * 3.5) + rnd * 6.2831 + gradMag * 14.0);
      float twinkleMask = smoothstep(0.45, 0.98, twinklePhase) * smoothstep(0.62, 0.92, luma + gradMag * 0.95);
      float star = starGlint(cellUv * 1.3, uTime * 0.35 + rnd * 3.14) * twinkleMask;

      // Rainbow prism glint on steep wave crests
      vec3 prismTint = 0.5 + 0.5 * cos(6.2831 * (gradMag * 2.2 + vec3(0.0, 0.33, 0.67)) + uTime * 1.5);
      vec3 waveSpecular = vec3(0.95, 0.98, 1.0) * (spec1 * 0.95 + spec2 * 0.75)
                        + mix(vec3(0.88, 0.95, 1.0), prismTint, 0.35) * (rimCrest * 0.36)
                        + vec3(1.0, 0.99, 0.96) * (star * 0.85 * uSparkle);

      // Subtle shadow on the back of deep troughs for 3D depth
      float troughShadow = clamp(physHeight * 0.12, -0.09, 0.09);
      col += troughShadow * vec3(0.08, 0.14, 0.22);
      col += waveSpecular * (0.65 + 0.55 * uSparkle);

      gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
    }
  `;

  function compileShader(type, source) {
    const s = gl.createShader(type);
    gl.shaderSource(s, source);
    gl.compileShader(s);
    return s;
  }

  const prog = gl.createProgram();
  gl.attachShader(prog, compileShader(gl.VERTEX_SHADER, VERT_SRC));
  gl.attachShader(prog, compileShader(gl.FRAGMENT_SHADER, FRAG_SRC));
  gl.linkProgram(prog);
  gl.useProgram(prog);

  const quadBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const aPosLoc = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPosLoc);
  gl.vertexAttribPointer(aPosLoc, 2, gl.FLOAT, false, 0, 0);

  const U = {
    uTex: gl.getUniformLocation(prog, 'uTex'),
    uWave: gl.getUniformLocation(prog, 'uWave'),
    uRes: gl.getUniformLocation(prog, 'uRes'),
    uTexSize: gl.getUniformLocation(prog, 'uTexSize'),
    uTime: gl.getUniformLocation(prog, 'uTime'),
    uSparkle: gl.getUniformLocation(prog, 'uSparkle')
  };

  function createTexture(unit) {
    const tex = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return tex;
  }

  const baseTex = createTexture(0);
  const waveTex = createTexture(1);
  gl.uniform1i(U.uTex, 0);
  gl.uniform1i(U.uWave, 1);

  /* ============================================================================
   * 3. 2D 波动方程求解器（支持点按双层水花环、手指滑动V字尾迹、边界柔反射）
   * ============================================================================ */
  let W = 1, H = 1, cell = 3.0, gw = 0, gh = 0;
  let curH, prevH, packedRGBA;
  let idleFrames = 0;
  const DAMPING = 0.9865;

  function resizeStage() {
    const rect = canvas.getBoundingClientRect();
    W = Math.max(1, rect.width);
    H = Math.max(1, rect.height);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);

    cell = Math.max(2.3, Math.sqrt((W * H) / 72000));
    const ngw = Math.ceil(W / cell) + 2;
    const ngh = Math.ceil(H / cell) + 2;
    if (ngw !== gw || ngh !== gh) {
      gw = ngw;
      gh = ngh;
      curH = new Float32Array(gw * gh);
      prevH = new Float32Array(gw * gh);
      packedRGBA = new Uint8Array(gw * gh * 4).fill(128);
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, waveTex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gw, gh, 0, gl.RGBA, gl.UNSIGNED_BYTE, packedRGBA);
      idleFrames = 0;
    }
  }

  // Drop a smooth cosine droplet or ring impulse onto the water surface
  function addDrop(x, y, radius, strength, isRing) {
    if (!curH) return;
    const gx = x / cell + 1;
    const gy = y / cell + 1;
    const r = Math.max(1.6, radius / cell);
    const x0 = Math.max(1, Math.floor(gx - r));
    const x1 = Math.min(gw - 2, Math.ceil(gx + r));
    const y0 = Math.max(1, Math.floor(gy - r));
    const y1 = Math.min(gh - 2, Math.ceil(gy + r));

    for (let yy = y0; yy <= y1; yy++) {
      for (let xx = x0; xx <= x1; xx++) {
        const d = Math.hypot(xx - gx, yy - gy);
        if (d < r) {
          const normD = d / r;
          const profile = isRing
            ? Math.sin(normD * Math.PI * 2.0) * (1.0 - normD)
            : 0.5 * (1.0 + Math.cos(Math.PI * normD));
          curH[yy * gw + xx] += strength * profile;
        }
      }
    }
    idleFrames = 0;
  }

  function stepWavePhysics() {
    for (let y = 1; y < gh - 1; y++) {
      let i = y * gw + 1;
      for (let x = 1; x < gw - 1; x++, i++) {
        // 8-neighbor isotropic wave propagation for rounder, silkier concentric rings
        const ortho = curH[i - 1] + curH[i + 1] + curH[i - gw] + curH[i + gw];
        const diag = curH[i - gw - 1] + curH[i - gw + 1] + curH[i + gw - 1] + curH[i + gw + 1];
        const avg = ortho * 0.4 + diag * 0.1;
        prevH[i] = (avg - prevH[i]) * DAMPING;
      }
    }
    const tmp = prevH;
    prevH = curH;
    curH = tmp;
    idleFrames++;
  }

  function uploadWaveTexture() {
    const gradScale = 135.0;
    const heightScale = 68.0;
    const curveScale = 95.0;

    for (let y = 1; y < gh - 1; y++) {
      let i = y * gw + 1;
      for (let x = 1; x < gw - 1; x++, i++) {
        const o = i * 4;
        const dx = curH[i + 1] - curH[i - 1];
        const dy = curH[i + gw] - curH[i - gw];
        const lap = (curH[i - 1] + curH[i + 1] + curH[i - gw] + curH[i + gw]) - 4.0 * curH[i];

        packedRGBA[o]     = Math.max(0, Math.min(255, 128 + dx * gradScale));
        packedRGBA[o + 1] = Math.max(0, Math.min(255, 128 + dy * gradScale));
        packedRGBA[o + 2] = Math.max(0, Math.min(255, 128 + curH[i] * heightScale));
        packedRGBA[o + 3] = Math.max(0, Math.min(255, 128 - lap * curveScale));
      }
    }
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, waveTex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, gw, gh, gl.RGBA, gl.UNSIGNED_BYTE, packedRGBA);
  }

  /* ============================================================================
   * 4. 手指与鼠标交互控制（支持点按双波纹、顺滑划水轨迹、小鲸鱼跃水）
   * ============================================================================ */
  const pointers = new Map();
  const guideToast = document.getElementById('guideToast');
  let hasInteracted = false;

  function hideGuide() {
    if (!hasInteracted) {
      hasInteracted = true;
      guideToast.classList.add('hide-toast');
    }
  }

  function getLocalPos(e) {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function addGlideTrail(a, b, radius, strength) {
    const dist = Math.hypot(b.x - a.x, b.y - a.y);
    const steps = Math.min(42, Math.max(1, Math.floor(dist / Math.max(cell * 1.3, 3.5))));
    for (let k = 1; k <= steps; k++) {
      const t = k / steps;
      addDrop(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t, radius, strength, false);
    }
  }

  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    const p = getLocalPos(e);
    pointers.set(e.pointerId, p);

    // Primary finger depression + rebounding crown wave ring
    const r = e.pointerType === 'touch' ? 21 : 17;
    addDrop(p.x, p.y, r, -2.0, false);
    setTimeout(() => addDrop(p.x, p.y, r * 1.45, 0.95, true), 95);

    SoundEngine.unlock();
    SoundEngine.tap(p.x / W, p.y / H);
    hideGuide();
  });

  canvas.addEventListener('pointermove', e => {
    const p = getLocalPos(e);
    const prev = pointers.get(e.pointerId);
    const isPressed = e.buttons !== 0 || e.pointerType === 'touch';
    if (prev) {
      if (isPressed) {
        addGlideTrail(prev, p, 12.5, -0.38);
        SoundEngine.drag(p.x / W, p.y / H);
      } else if (e.pointerType === 'mouse') {
        addGlideTrail(prev, p, 9.0, -0.09);
      }
    }
    pointers.set(e.pointerId, p);
  });

  function clearPointer(e) {
    SoundEngine.unlock();
    if (e.pointerType !== 'mouse') {
      pointers.delete(e.pointerId);
    }
  }
  canvas.addEventListener('pointerup', clearPointer);
  canvas.addEventListener('pointercancel', clearPointer);
  canvas.addEventListener('pointerleave', e => pointers.delete(e.pointerId));
  document.addEventListener('touchend', () => SoundEngine.unlock(), { passive: true });

  /* ============================================================================
   * 5. 顶部与底部交互按钮
   * ============================================================================ */
  let rainActive = true;
  let sparkleLevel = 1.15; // 1.15 = 璀璨, 0.65 = 柔和, 0.0 = 关

  const rainToggle = document.getElementById('rainToggle');
  const whaleBtn = document.getElementById('whaleBtn');
  const sparkleToggle = document.getElementById('sparkleToggle');
  const bgmToggle = document.getElementById('bgmToggle');
  const sfxToggle = document.getElementById('sfxToggle');

  rainToggle.addEventListener('click', () => {
    SoundEngine.unlock();
    rainActive = !rainActive;
    rainToggle.dataset.off = (!rainActive).toString();
    rainToggle.textContent = rainActive ? '🌧️ 细雨 · 开' : '🌧️ 细雨 · 关';
  });

  whaleBtn.addEventListener('click', () => {
    SoundEngine.unlock();
    SoundEngine.whaleSplash();
    hideGuide();
    // "小鲸鱼跃水" creates a blooming ring of ripples across the flowers
    const cx = W * 0.5, cy = H * 0.5;
    addDrop(cx, cy, 32, -2.5, false);
    for (let i = 0; i < 6; i++) {
      setTimeout(() => {
        const ang = (i / 6) * Math.PI * 2 + 0.4;
        const rx = cx + Math.cos(ang) * (W * 0.24);
        const ry = cy + Math.sin(ang) * (H * 0.18);
        addDrop(rx, ry, 18, -1.45, true);
      }, 110 + i * 85);
    }
  });

  sparkleToggle.addEventListener('click', () => {
    SoundEngine.unlock();
    if (sparkleLevel > 1.0) {
      sparkleLevel = 0.6;
      sparkleToggle.textContent = '✨ 波光 · 柔和';
      sparkleToggle.dataset.off = 'false';
    } else if (sparkleLevel > 0.1) {
      sparkleLevel = 0.0;
      sparkleToggle.textContent = '✨ 波光 · 关';
      sparkleToggle.dataset.off = 'true';
    } else {
      sparkleLevel = 1.15;
      sparkleToggle.textContent = '✨ 波光 · 璀璨';
      sparkleToggle.dataset.off = 'false';
    }
  });

  bgmToggle.addEventListener('click', () => {
    const on = SoundEngine.toggleBgm();
    bgmToggle.dataset.off = (!on).toString();
    bgmToggle.textContent = on ? '♪ 萨蒂《吉诺佩蒂》' : '♪ 音乐 · 关';
  });

  sfxToggle.addEventListener('click', () => {
    const on = SoundEngine.toggleSfx();
    sfxToggle.dataset.off = (!on).toString();
    sfxToggle.textContent = on ? '💧 水声 · 开' : '💧 水声 · 关';
  });

  /* ============================================================================
   * 6. 细雨与主渲染循环
   * ============================================================================ */
  let nextRainTime = performance.now() + 1400;
  function updateRain(now) {
    if (!rainActive || now < nextRainTime) return;
    nextRainTime = now + 1300 + Math.random() * 2400;
    const rx = (0.1 + Math.random() * 0.8) * W;
    const ry = (0.1 + Math.random() * 0.8) * H;
    const rr = 8 + Math.random() * 10;
    addDrop(rx, ry, rr, -(0.55 + Math.random() * 0.65), false);
    setTimeout(() => addDrop(rx, ry, rr * 1.3, 0.35, true), 90);
  }

  const startTime = performance.now();
  let lastFrameTime = startTime;
  let physAccum = 0;
  let currentSparkle = sparkleLevel;
  let isReady = false;

  function renderLoop(now) {
    requestAnimationFrame(renderLoop);
    if (!isReady) return;

    updateRain(now);

    const dt = Math.min(0.1, (now - lastFrameTime) / 1000);
    lastFrameTime = now;
    physAccum += dt;

    let stepped = false;
    while (physAccum >= 1 / 60) {
      physAccum -= 1 / 60;
      if (idleFrames < 900) {
        stepWavePhysics();
        stepped = true;
      }
    }
    if (stepped) {
      uploadWaveTexture();
    }

    currentSparkle += (sparkleLevel - currentSparkle) * 0.08;

    gl.uniform2f(U.uRes, W, H);
    gl.uniform1f(U.uTime, (now - startTime) / 1000);
    gl.uniform1f(U.uSparkle, currentSparkle);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  const flowerImg = new Image();
  flowerImg.crossOrigin = 'anonymous';
  flowerImg.onload = () => {
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, baseTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, flowerImg);
    gl.uniform2f(U.uTexSize, flowerImg.naturalWidth || 576, flowerImg.naturalHeight || 1024);

    resizeStage();
    isReady = true;

    // Gentle opening ripples over the four blossoms
    setTimeout(() => addDrop(W * 0.32, H * 0.25, 24, -2.0, false), 350);
    setTimeout(() => addDrop(W * 0.72, H * 0.50, 22, -1.7, true), 850);
    setTimeout(() => addDrop(W * 0.26, H * 0.68, 20, -1.5, false), 1350);
  };
  flowerImg.src = IMG_DATA_URI;

  window.addEventListener('resize', () => {
    if (isReady) resizeStage();
  });
  setTimeout(() => guideToast.classList.add('hide-toast'), 8500);
  requestAnimationFrame(renderLoop);
})();
</script>
</body>
</html>
